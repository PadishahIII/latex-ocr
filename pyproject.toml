[project]
name = "latex-ocr"
version = "1.0.0"
description = "Standalone LaTeX formula OCR: CoCa model, training recipes, Gradio web UI, and a FastAPI inference API server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "latex-ocr contributors" }]
keywords = ["latex", "ocr", "image-to-text", "transformer", "coca", "im2latex"]

dependencies = [
    "click>=8.3.0",
    "datasets>=4.1.1",
    "huggingface-hub>=0.36.0",
    "matplotlib>=3.10.6",
    "mlflow>=3.4.0",
    "minio>=7.2.18",
    "numpy>=2.3.3",
    "pillow>=12.0.0",
    "psutil>=7.1.0",
    "pydantic>=2.11.9",
    "python-levenshtein>=0.27.3",
    "ray[tune]>=2.49.2",
    "sacrebleu>=2.5.1",
    "sentencepiece>=0.2.1",
    "timm>=1.0.22",
    "torch>=2.9.0",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.8.2",
    "torchtune>=0.6.1",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.2",
    "typing-extensions>=4.15.0",
    "torchao<0.15",
]

[project.optional-dependencies]
# Inference servers (Gradio web UI + FastAPI API). Install with: uv sync --extra server
server = [
    "fastapi>=0.115.0",
    # 6.x required: gr.Latex was removed in Gradio 6; rendering goes through
    # gr.Markdown (KaTeX, $$...$$ delimiters). webui.py targets the 6.x API.
    "gradio>=6,<7",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
# Optional: LaTeX rendering/visualizer tooling in latex_ocr/data/pipeline
render = [
    "streamlit>=1.40.0",
]

# PyTorch wheels built for CUDA 12.6 — needed for GPUs with compute capability
# <= 7.0 (Maxwell/Pascal/Volta, e.g. V100); PyTorch 2.11+cu128 builds dropped
# sm_70. Combine with other extras: uv sync --extra cu126 --extra server
cu126 = [
    "torch>=2.9.0",
    "torchvision>=0.23.0",
]

# PyTorch wheels built for CUDA 12.8 — for Turing (sm_75) and newer GPUs.
cu128 = [
    "torch>=2.9.0",
    "torchvision>=0.23.0",
]

[project.scripts]
latex-ocr = "latex_ocr.cli:main"
latex-ocr-server = "latex_ocr.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Universal lockfile: default `uv sync` resolves plain PyPI torch (works on CPU and
# recent CUDA GPUs); the cu126/cu128 extras repoint torch/torchvision at the
# matching PyTorch index instead.
index-strategy = "first-index"

# The CUDA-flavor extras use mutually exclusive index pins, so they cannot be
# requested together in one sync.
conflicts = [[{ extra = "cu126" }, { extra = "cu128" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu126", extra = "cu126" },
]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "httpx[socks]>=0.28.1",
]
