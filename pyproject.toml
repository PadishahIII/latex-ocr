[project]
name = "latex-ocr"
version = "0.1.0"
description = "Standalone LaTeX formula OCR: training recipes (CoCa/Swin, Xception+GRU) and an OpenAI-friendly inference API server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "latex-ocr contributors" }]
keywords = ["latex", "ocr", "image-to-text", "transformer", "coca", "im2latex"]

dependencies = [
    "click>=8.3.0",
    "datasets>=4.1.1",
    "huggingface-hub>=0.36.0",
    "matplotlib>=3.10.6",
    "mlflow>=3.4.0",
    "minio>=7.2.18",
    "numpy>=2.3.3",
    "pillow>=12.0.0",
    "psutil>=7.1.0",
    "pydantic>=2.11.9",
    "python-levenshtein>=0.27.3",
    "ray[tune]>=2.49.2",
    "sacrebleu>=2.5.1",
    "sentencepiece>=0.2.1",
    "timm>=1.0.22",
    "torch>=2.9.0",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.8.2",
    "torchtune>=0.6.1",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.2",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
# Inference API server (fastapi-based). Install with: uv sync --extra server
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
# Optional: LaTeX rendering/visualizer tooling in latex_ocr/data/pipeline
render = [
    "streamlit>=1.40.0",
]

[project.scripts]
latex-ocr-server = "latex_ocr.serve:main"

[tool.uv]
# Reuse the CUDA 12.8 wheels from the PyTorch index; fall back to PyPI otherwise.
index-strategy = "first-index"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
